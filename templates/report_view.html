{% extends "base.html" %}

{% block title %}{{ title }} - Employee Management System{% endblock %}

{% block content %}
<div class="container">
    <div class="mb-3">
        <a href="{{ url_for('reports_page') }}" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> Back to Reports
        </a>
    </div>

    <div class="card">
        <div class="card-header bg-white">
            <h4 class="mb-0"><i class="bi bi-file-earmark-text"></i> {{ title }}</h4>
        </div>
        <div class="card-body">
            <pre class="report-content">{{ report_content }}</pre>
        </div>
    </div>
</div>

<style>
.report-content {
    background-color: #f8f9fa;
    padding: 20px;
    border-radius: 8px;
    font-family: 'Courier New', monospace;
    font-size: 0.9rem;
    white-space: pre-wrap;
    word-wrap: break-word;
    max-height: 70vh;
    overflow-y: auto;
}
</style>
{% endblock %}
