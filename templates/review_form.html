{% extends "base.html" %}

{% block title %}Add Performance Review - Employee Management System{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-white">
                    <h4 class="mb-0"><i class="bi bi-star"></i> Add Performance Review</h4>
                </div>
                <div class="card-body">
                    <form method="POST">
                        <div class="mb-3">
                            <label for="employee_id" class="form-label">Select Employee *</label>
                            <select class="form-select" id="employee_id" name="employee_id" required>
                                <option value="">Choose an employee...</option>
                                {% for emp in employees %}
                                <option value="{{ emp.employee_id }}" 
                                        {% if request.args.get('employee_id') == emp.employee_id|string %}selected{% endif %}>
                                    {{ emp.first_name }} {{ emp.last_name }} ({{ emp.department }})
                                </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="reviewer_name" class="form-label">Reviewer Name *</label>
                                <input type="text" class="form-control" id="reviewer_name" name="reviewer_name" 
                                       value="{{ session.user.name }}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="review_period" class="form-label">Review Period *</label>
                                <input type="text" class="form-control" id="review_period" name="review_period" 
                                       placeholder="e.g., Q1 2024, Annual 2024" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="overall_rating" class="form-label">Overall Rating (1-5) *</label>
                            <input type="number" class="form-control" id="overall_rating" name="overall_rating" 
                                   min="1" max="5" step="0.1" required>
                            <small class="text-muted">Enter a rating between 1.0 and 5.0</small>
                        </div>

                        <div class="mb-3">
                            <label for="strengths" class="form-label">Strengths</label>
                            <textarea class="form-control" id="strengths" name="strengths" rows="3" 
                                      placeholder="List employee's key strengths..."></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="areas_for_improvement" class="form-label">Areas for Improvement</label>
                            <textarea class="form-control" id="areas_for_improvement" name="areas_for_improvement" rows="3" 
                                      placeholder="List areas where employee can improve..."></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="goals" class="form-label">Goals</label>
                            <textarea class="form-control" id="goals" name="goals" rows="3" 
                                      placeholder="Set goals for next review period..."></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="comments" class="form-label">Additional Comments</label>
                            <textarea class="form-control" id="comments" name="comments" rows="3" 
                                      placeholder="Any additional feedback..."></textarea>
                        </div>

                        <div class="d-flex justify-content-between mt-4">
                            <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">
                                <i class="bi bi-arrow-left"></i> Cancel
                            </a>
                            <button type="submit" class="btn btn-success">
                                <i class="bi bi-check-circle"></i> Submit Review
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
