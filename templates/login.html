{% extends "base.html" %}

{% block title %}Login - Employee Management System{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <div class="text-center mb-4">
            <i class="bi bi-building login-icon"></i>
            <h2 class="mt-3">Synergy Portal</h2>
            <p class="text-muted">Employee Management System</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}">
            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" class="form-control" id="email" name="email" 
                           placeholder="Enter your email" required autofocus>
                </div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" name="password" 
                           placeholder="Enter your password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 mb-3">
                <i class="bi bi-box-arrow-in-right"></i> Sign In
            </button>
        </form>

        <div class="login-info">
            <p class="text-muted text-center mb-2"><small>Access restricted to HR and Project Managers</small></p>
            <hr>
            <p class="text-muted mb-1"><small><strong>Demo Credentials:</strong></small></p>
            <p class="text-muted mb-0"><small>HR: hr@company.com / hr123</small></p>
            <p class="text-muted"><small>PM: pm@company.com / pm123</small></p>
        </div>
    </div>
</div>
{% endblock %}
